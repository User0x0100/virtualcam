[package]
name = "virtualcam"
version = "0.1.0"
edition = "2024"
description = "Manage NV12 DirectShow cameras and write host or CUDA frames to Windows virtual cameras"
license = "MIT"
readme = "README.md"
keywords = ["virtual-camera", "obs", "unity", "cuda", "windows"]
categories = ["multimedia::video", "os::windows-apis"]

[workspace]
members = [".", "crates/virtualcam-protocol"]

[features]
default = []
cuda = []
tracing = ["dep:tracing"]

[dependencies]
virtualcam-protocol = { path = "crates/virtualcam-protocol" }
tracing = { version = "0.1.41", optional = true, default-features = false, features = ["std"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Performance",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
    "Win32_UI_Shell",
] }
windows-core = "0.62"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Media_DirectShow",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
] }
