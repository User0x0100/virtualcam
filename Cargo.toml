[package]
name = "virtualcam"
version = "0.1.0"
edition = "2024"
description = "Manage NV12 DirectShow cameras and write host or CUDA frames to Windows virtual cameras"
license = "MIT"
readme = "README.md"
keywords = ["virtual-camera", "obs", "unity", "cuda", "windows"]
categories = ["multimedia::video", "os::windows-apis"]

[features]
default = []
cuda = []
tracing = ["dep:tracing"]

[dependencies]
tracing = { version = "0.1.41", optional = true, default-features = false, features = ["std"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Performance",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
] }
